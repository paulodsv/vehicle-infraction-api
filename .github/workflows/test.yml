name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: test_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          INFOSIMPLES_INFRACTIONS_URL: http://fake-url.com
          INFOSIMPLES_DETAILS_URL: http://fake-url.com
          INFOSIMPLES_TOKEN: ${{ secrets.INFOSIMPLES_TOKEN }}
          INFOSIMPLES_CRYPTO_KEY: ${{ secrets.INFOSIMPLES_CRYPTO_KEY }}
          GOV_CPF: ${{ secrets.GOV_CPF }}
          GOV_SENHA: ${{ secrets.GOV_SENHA }}
        run: pytest